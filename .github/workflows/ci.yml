name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - name: WeasyPrint system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ledgerline:ci
      - name: Entrypoint refuses to start without a secret key
        run: |
          if docker run --rm ledgerline:ci true; then echo "expected failure"; exit 1; fi

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack with demo data
        run: |
          cat > .env <<EOF
          LEDGERLINE_SECRET_KEY=$(openssl rand -hex 32)
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          LEDGERLINE_APP_DB_PASSWORD=$(openssl rand -hex 16)
          LEDGERLINE_COOKIE_SECURE=false
          LEDGERLINE_ENVIRONMENT=development
          LEDGERLINE_INITIAL_OWNER_EMAIL=demo@ledgerline.example
          LEDGERLINE_INITIAL_PASSWORD=demo-password-123
          LEDGERLINE_BIND=127.0.0.1:8765
          EOF
          docker compose up -d --build --wait app
          docker compose exec -T app ledgerline seed-demo --email demo@ledgerline.example
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: docker compose down -v
