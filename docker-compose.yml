services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ledgerline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ledgerline
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: migrations and the app role's grants, with the owner credentials. Exits when done.
  migrate:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    command: ["true"]
    healthcheck:
      disable: true
    environment:
      LEDGERLINE_MIGRATION_DATABASE_URL: postgresql+psycopg://ledgerline:${POSTGRES_PASSWORD}@db:5432/ledgerline
      LEDGERLINE_APP_DB_PASSWORD: ${LEDGERLINE_APP_DB_PASSWORD:?set LEDGERLINE_APP_DB_PASSWORD in .env}
      LEDGERLINE_SECRET_KEY: ${LEDGERLINE_SECRET_KEY:?set LEDGERLINE_SECRET_KEY in .env}

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      LEDGERLINE_DATABASE_URL: postgresql+psycopg://ledgerline_app:${LEDGERLINE_APP_DB_PASSWORD}@db:5432/ledgerline
      LEDGERLINE_SECRET_KEY: ${LEDGERLINE_SECRET_KEY:?set LEDGERLINE_SECRET_KEY in .env}
      LEDGERLINE_COOKIE_SECURE: ${LEDGERLINE_COOKIE_SECURE:-true}
      LEDGERLINE_SESSION_MAX_AGE_SECONDS: ${LEDGERLINE_SESSION_MAX_AGE_SECONDS:-28800}
      LEDGERLINE_MAX_UPLOAD_BYTES: ${LEDGERLINE_MAX_UPLOAD_BYTES:-10485760}
      LEDGERLINE_INITIAL_OWNER_EMAIL: ${LEDGERLINE_INITIAL_OWNER_EMAIL:-}
      LEDGERLINE_INITIAL_PASSWORD: ${LEDGERLINE_INITIAL_PASSWORD:-}
      LEDGERLINE_PUBLIC_BASE_URL: ${LEDGERLINE_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      LEDGERLINE_SOURCE_URL: ${LEDGERLINE_SOURCE_URL:-https://github.com/RAJUSHANIGARAPU/ledgerline}
      LEDGERLINE_SMTP_HOST: ${LEDGERLINE_SMTP_HOST:-}
      LEDGERLINE_SMTP_PORT: ${LEDGERLINE_SMTP_PORT:-587}
      LEDGERLINE_SMTP_TLS: ${LEDGERLINE_SMTP_TLS:-starttls}
      LEDGERLINE_SMTP_USER: ${LEDGERLINE_SMTP_USER:-}
      LEDGERLINE_SMTP_PASSWORD: ${LEDGERLINE_SMTP_PASSWORD:-}
      LEDGERLINE_SMTP_FROM: ${LEDGERLINE_SMTP_FROM:-}
      LEDGERLINE_ENVIRONMENT: ${LEDGERLINE_ENVIRONMENT:-production}
      # Uploads from the browser and phone are read in this process.
      LEDGERLINE_EXTRACTION_PROVIDER: ${LEDGERLINE_EXTRACTION_PROVIDER:-none}
      LEDGERLINE_EXTRACTION_MODEL: ${LEDGERLINE_EXTRACTION_MODEL:-claude-opus-5-5}
      LEDGERLINE_EXTRACTION_MONTHLY_LIMIT: ${LEDGERLINE_EXTRACTION_MONTHLY_LIMIT:-200}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEDGERLINE_HEALTH_REQUIRE_OFFSITE_BACKUP: ${LEDGERLINE_HEALTH_REQUIRE_OFFSITE_BACKUP:-false}
    volumes:
      - ops:/var/lib/ledgerline/ops
    ports:
      - "${LEDGERLINE_BIND:-127.0.0.1:8000}:8000"

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["ledgerline", "worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/var/lib/ledgerline/ops/worker.heartbeat') > 60)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    environment:
      LEDGERLINE_DATABASE_URL: postgresql+psycopg://ledgerline_app:${LEDGERLINE_APP_DB_PASSWORD:?set LEDGERLINE_APP_DB_PASSWORD in .env}@db:5432/ledgerline
      LEDGERLINE_SECRET_KEY: ${LEDGERLINE_SECRET_KEY:?set LEDGERLINE_SECRET_KEY in .env}
      LEDGERLINE_MAX_UPLOAD_BYTES: ${LEDGERLINE_MAX_UPLOAD_BYTES:-10485760}
      LEDGERLINE_SMTP_HOST: ${LEDGERLINE_SMTP_HOST:-}
      LEDGERLINE_SMTP_PORT: ${LEDGERLINE_SMTP_PORT:-587}
      LEDGERLINE_SMTP_TLS: ${LEDGERLINE_SMTP_TLS:-starttls}
      LEDGERLINE_SMTP_USER: ${LEDGERLINE_SMTP_USER:-}
      LEDGERLINE_SMTP_PASSWORD: ${LEDGERLINE_SMTP_PASSWORD:-}
      LEDGERLINE_SMTP_FROM: ${LEDGERLINE_SMTP_FROM:-}
      LEDGERLINE_ENVIRONMENT: ${LEDGERLINE_ENVIRONMENT:-production}
      LEDGERLINE_IMAP_HOST: ${LEDGERLINE_IMAP_HOST:-}
      LEDGERLINE_IMAP_PORT: ${LEDGERLINE_IMAP_PORT:-993}
      LEDGERLINE_IMAP_USER: ${LEDGERLINE_IMAP_USER:-}
      LEDGERLINE_IMAP_PASSWORD: ${LEDGERLINE_IMAP_PASSWORD:-}
      LEDGERLINE_IMAP_FOLDER: ${LEDGERLINE_IMAP_FOLDER:-INBOX}
      LEDGERLINE_IMAP_PROCESSED_FOLDER: ${LEDGERLINE_IMAP_PROCESSED_FOLDER:-Ledgerline/Processed}
      LEDGERLINE_IMAP_POLL_SECONDS: ${LEDGERLINE_IMAP_POLL_SECONDS:-300}
      LEDGERLINE_IMAP_DEFAULT_ADMINISTRATION_ID: ${LEDGERLINE_IMAP_DEFAULT_ADMINISTRATION_ID:-1}
      LEDGERLINE_IMAP_ALLOWED_SENDERS: ${LEDGERLINE_IMAP_ALLOWED_SENDERS:-}
      LEDGERLINE_EXTRACTION_PROVIDER: ${LEDGERLINE_EXTRACTION_PROVIDER:-none}
      LEDGERLINE_EXTRACTION_MODEL: ${LEDGERLINE_EXTRACTION_MODEL:-claude-opus-5-5}
      LEDGERLINE_EXTRACTION_MONTHLY_LIMIT: ${LEDGERLINE_EXTRACTION_MONTHLY_LIMIT:-200}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LEDGERLINE_HEALTHCHECK_PING_URL: ${LEDGERLINE_HEALTHCHECK_PING_URL:-}
      LEDGERLINE_HEALTHCHECK_PING_SECONDS: ${LEDGERLINE_HEALTHCHECK_PING_SECONDS:-300}
    volumes:
      - ops:/var/lib/ledgerline/ops

  # Nightly pg_dump (local tier) + encrypted off-site copy with restic. See docs/OPERATIONS.md.
  backup:
    build: ./ops/backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGUSER: ledgerline
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ledgerline
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_CHECK_WEEKDAY: ${BACKUP_CHECK_WEEKDAY:-7}
      BACKUP_HEALTHCHECK_PING_URL: ${BACKUP_HEALTHCHECK_PING_URL:-}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
    volumes:
      - ./backups:/backups
      - ops:/ops

volumes:
  pgdata:
  ops:
