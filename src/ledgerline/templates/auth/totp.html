{% extends "base.html" %}
{% block title %}Second step{% endblock %}
{% block public %}
<div class="auth-page">
  <div class="card auth-card">
    <div class="brand brand-lg">
      <img src="{{ url_for('static', path='img/mark.svg') }}" alt="" width="36" height="36">
      <span>Ledgerline</span>
    </div>
    {% for f in flashes %}<div class="flash flash-{{ f.kind }}" role="status">{{ f.message }}</div>{% endfor %}
    <p class="muted">Enter the 6-digit code from your authenticator app, or a recovery code.</p>
    {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
    <form class="stack" method="post" action="/login/totp">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label class="field"><span class="field-label">Code</span>
        <input class="input" type="text" name="code" inputmode="numeric" autocomplete="one-time-code" required autofocus></label>
      <button class="btn btn-primary btn-block" type="submit">Verify</button>
    </form>
    <p class="fine-print"><a href="/login">Start over</a></p>
  </div>
</div>
{% endblock %}
