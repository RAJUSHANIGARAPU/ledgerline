{% extends "base.html" %}
{% block title %}Choose a workspace{% endblock %}
{% block public %}
<div class="auth-page">
  <div class="card auth-card">
    <div class="brand brand-lg">
      <img src="{{ url_for('static', path='img/mark.svg') }}" alt="" width="36" height="36">
      <span>Ledgerline</span>
    </div>
    <p class="muted">Choose the account you want to work in.</p>
    {% for m in memberships %}
    <form method="post" action="/tenants" data-purge-queue>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="hidden" name="tenant_id" value="{{ m.tenant.id }}">
      <button class="btn btn-block" type="submit">{{ m.tenant.name }} <span class="muted">({{ m.role }})</span></button>
    </form>
    {% endfor %}
    <form method="post" action="/logout" data-purge-queue>
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="link-button" type="submit">Sign out</button>
    </form>
  </div>
</div>
{% endblock %}
