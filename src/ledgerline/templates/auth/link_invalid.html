{% extends "base.html" %}
{% block title %}{{ t('auth.link_invalid.title') }}{% endblock %}
{% block public %}
<div class="auth-page">
  <div class="card auth-card">
    <div class="brand brand-lg">
      <img src="{{ url_for('static', path='img/mark.svg') }}" alt="" width="36" height="36">
      <span>Ledgerline</span>
    </div>
    {% for f in flashes %}<div class="flash flash-{{ f.kind }}" role="status">{{ f.message }}</div>{% endfor %}
    <div class="flash flash-error" role="alert">{{ t('auth.link_invalid.body') }}</div>
    <p class="fine-print"><a href="/login">{{ t('auth.back_to_login') }}</a> · <a href="/forgot">{{ t('auth.forgot_link') }}</a></p>
  </div>
</div>
{% endblock %}
