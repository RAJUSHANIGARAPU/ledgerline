{% extends "base.html" %}
{% block title %}Link not valid{% endblock %}
{% block public %}
<div class="auth-page">
  <div class="card auth-card">
    <div class="brand brand-lg">
      <img src="{{ url_for('static', path='img/mark.svg') }}" alt="" width="36" height="36">
      <span>Ledgerline</span>
    </div>
    {% for f in flashes %}<div class="flash flash-{{ f.kind }}" role="status">{{ f.message }}</div>{% endfor %}
    <div class="flash flash-error" role="alert">This link is not valid. It may have expired or been used already.</div>
    <p class="fine-print"><a href="/login">Back to sign in</a> · <a href="/forgot">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
