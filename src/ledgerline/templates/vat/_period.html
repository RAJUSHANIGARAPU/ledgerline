<form method="get" class="toolbar">
  <label class="field"><span class="field-label">Period</span>
    <select class="input" name="kind">
      {% for k in ('month', 'quarter', 'year') %}<option value="{{ k }}" {% if p.kind == k %}selected{% endif %}>{{ k|capitalize }}</option>{% endfor %}
    </select></label>
  <label class="field"><span class="field-label">Year</span>
    <select class="input" name="year">{% for y in years %}<option value="{{ y }}" {% if p.year == y %}selected{% endif %}>{{ y }}</option>{% endfor %}</select></label>
  <label class="field"><span class="field-label">Month / quarter</span>
    <input class="input" type="number" name="number" min="1" max="12" value="{{ p.number }}"></label>
  <button class="btn btn-secondary" type="submit">Show</button>
</form>
