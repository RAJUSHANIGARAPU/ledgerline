[project]
name = "ledgerline"
version = "0.1.0"
description = "Self-hosted double-entry bookkeeping for Dutch small businesses"
readme = "README.md"
license = "AGPL-3.0-only"
authors = [{ name = "Raju Shanigarapu" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "pydantic-settings>=2.6",
    "defusedxml>=0.7",
    "schwifty>=2024.11",
    "weasyprint>=63",
    "mt-940>=4.30",
    "anthropic>=2.6",
    "pypdf>=5.1",
    "pyotp>=2.10.0",
    "segno>=1.6.6",
    "cryptography>=50.0.2",
]

[project.scripts]
ledgerline = "ledgerline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.120",
    "testcontainers[postgres]>=4.9",
    "httpx>=0.28",
    "ruff>=0.8",
    "mutmut>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tests/tenancy/**" = ["S608"]
"tests/ops/**" = ["S603", "S607"]
"migrations/**" = ["E501", "S608"]
"src/ledgerline/vat/sources.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mutmut]
paths_to_mutate = ["src/ledgerline/ledger/", "src/ledgerline/vat/", "src/ledgerline/money.py"]
